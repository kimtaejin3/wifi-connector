<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>와이파이 렌즈</title>
<meta name="description" content="Wi-Fi 안내문을 카메라로 비추면 이름과 비밀번호를 읽어 바로 연결해 주는 앱.">
<link rel="icon" href="/icon.png">
<style>
:root{--bg:#fff;--ink:#1f2333;--muted:#6b7190;--line:#e9ebf2;--accent:#5b67f1;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1220;--ink:#f2f3fa;--muted:#9aa0bc;--line:#262b44;--accent:#7b85ff;--on:#0f1220}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.6}
main{max-width:480px;padding:48px 24px;text-align:center}
img{width:96px;height:96px;border-radius:22px}
h1{font-size:30px;letter-spacing:-.5px;margin:24px 0 8px}
p{color:var(--muted);font-size:17px;margin:0 0 32px}
.btn{display:inline-block;background:var(--accent);color:var(--on);text-decoration:none;font-weight:600;padding:14px 28px;border-radius:999px}
nav{margin-top:40px;font-size:14px}
nav a{color:var(--muted)}
</style>
</head>
<body>
<main>
  <img src="/icon.png" alt="와이파이 렌즈 아이콘">
  <h1>와이파이 렌즈</h1>
  <p>Wi-Fi 안내문을 카메라로 비추면 이름과 비밀번호를 읽어 바로 연결해 드려요.</p>
  <a class="btn" href="https://apps.apple.com/kr/app/id6816278907">App Store에서 받기</a>
  <nav><a href="/privacy">개인정보 처리방침</a></nav>
</main>
</body>
</html>
